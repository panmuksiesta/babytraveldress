<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>BabyTravel 寶寶穿搭天氣指南（簡化版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- html2canvas 用來把畫面存成圖片 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- 可愛字體 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Zen Maru Gothic"', '"Fredoka"', "system-ui", "sans-serif"],
            },
            colors: {
              "baby-bg": "#FFFBF0",
              "baby-card": "#FFFFFF",
              "baby-text": "#4B5563",
              "accent-primary": "#FF8BA7",
              "baby-yellow": "#FEF3C7",
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #fffbf0;
        color: #5d5d5d;
        font-family: "Zen Maru Gothic", "Fredoka", system-ui, sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #ff8ba7;
        border-radius: 20px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

  <body class="min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4 md:p-8">
      <div class="w-full max-w-5xl mx-auto">
        <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl shadow-rose-100 border border-rose-100 px-6 md:px-10 py-8 md:py-10">
          <!-- Header -->
          <header class="mb-8">
            <div class="flex items-center justify-between gap-3 mb-2">
              <div>
                <p class="text-[10px] uppercase tracking-[0.3em] text-rose-300">
                  BABYTRAVEL WEATHER &amp; STYLE
                </p>
                <h1 class="text-2xl md:text-3xl font-bold text-baby-text mt-1">
                  寶寶穿搭天氣小幫手
                </h1>
              </div>
              <div class="hidden md:flex items-center gap-2 text-xs text-gray-400">
                <span class="inline-flex h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>
                <span>Gemini API</span>
              </div>
            </div>
            <p class="text-xs md:text-sm text-gray-500">
              貼上你的 Gemini API Key，就能幫你做旅程天氣估算與寶寶穿搭建議，還有專屬插圖。
            </p>
          </header>

          <!-- API Key 區塊 -->
          <section class="mb-6 p-4 rounded-2xl bg-rose-50/80 border border-rose-100 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-baby-text">
                  Gemini API Key
                </span>
                <span class="text-[10px] text-gray-400">
                  （只會儲存在你的瀏覽器中）
                </span>
              </div>
              <span id="apiStatusBadge" class="inline-flex items-center gap-1 text-[10px] text-amber-600">
                <span class="w-2 h-2 bg-amber-400 rounded-full"></span>
                尚未設定
              </span>
            </div>
            <div class="flex flex-col md:flex-row gap-3">
              <input
                id="apiKeyInput"
                type="password"
                placeholder="請貼上你的 Gemini API Key"
                class="flex-1 px-3 py-2 text-xs md:text-sm rounded-xl border border-rose-200 bg-white/80 outline-none focus:ring-2 focus:ring-accent-primary/40"
              />
              <div class="flex gap-2">
                <button
                  id="saveApiBtn"
                  type="button"
                  class="px-3 md:px-4 py-2 text-xs md:text-sm rounded-xl bg-accent-primary text-white font-semibold hover:bg-rose-500 transition-colors"
                >
                  儲存
                </button>
                <button
                  id="resetApiBtn"
                  type="button"
                  class="px-3 md:px-4 py-2 text-xs md:text-sm rounded-xl bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors"
                >
                  重設
                </button>
              </div>
            </div>
          </section>

          <!-- 查詢表單 -->
          <form
            id="searchForm"
            class="mb-6 flex flex-col md:flex-row gap-3 md:gap-4 items-stretch"
          >
            <div class="flex-1 flex items-center bg-gray-50 rounded-3xl px-4">
              <span class="mr-2 text-lg">📍</span>
              <input
                id="destinationInput"
                type="text"
                placeholder="輸入目的地（例：東京、大阪、北海道）"
                class="w-full bg-transparent py-3 text-sm md:text-base text-gray-700 placeholder-gray-400 outline-none"
                required
              />
            </div>

            <div class="flex gap-2 bg-gray-50 rounded-3xl px-4 items-center">
              <input
                id="startDateInput"
                type="date"
                class="bg-transparent py-3 border-none focus:ring-0 text-gray-600 text-xs md:text-sm outline-none"
                required
              />
              <span class="text-gray-300 text-xs md:text-sm">to</span>
              <input
                id="endDateInput"
                type="date"
                class="bg-transparent py-3 border-none focus:ring-0 text-gray-600 text-xs md:text-sm outline-none"
                required
              />
            </div>

            <button
              type="submit"
              id="generateBtn"
              class="w-full md:w-auto px-6 py-3 rounded-3xl bg-accent-primary text-white font-bold text-sm md:text-base shadow-md shadow-rose-200 hover:bg-rose-500 transition-all flex items-center justify-center gap-2"
            >
              <span>🔍 生成寶寶穿搭</span>
            </button>
          </form>

          <!-- 狀態顯示 -->
          <div id="statusArea" class="mb-4 text-center text-xs text-gray-400">
            請先設定 API Key，輸入目的地與日期後按「生成寶寶穿搭」。
          </div>

          <!-- 結果區 -->
          <main id="resultsWrapper">
            <!-- 這裡用 JS 塞內容 -->
          </main>

          <!-- 匯出工具列 -->
          <div
            id="exportBar"
            class="mt-6 hidden flex-col md:flex-row items-center justify-between gap-3 bg-white/70 border border-rose-100 rounded-2xl px-4 py-3"
          >
            <div class="text-xs text-gray-400">
              <p>📸 可將上方整張卡片存成圖片，或匯出 Excel 詳細列表。</p>
            </div>
            <div class="flex gap-2">
              <button
                id="saveImageBtn"
                class="flex items-center gap-2 px-4 py-2 bg-gray-800 text-white rounded-full hover:bg-gray-700 transition-colors text-sm font-bold"
              >
                📸 Save as Image
              </button>
              <button
                id="exportExcelBtn"
                class="flex items-center gap
