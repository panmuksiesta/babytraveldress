<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyTravel - 寶寶天氣穿搭助手</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <script src="client.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FFFBF0; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 針對截圖優化的樣式 */
        .weather-card-export {
            background-color: #FFFFFF !important; 
            border: 1px solid #E5E7EB;
            padding: 2rem;
            border-radius: 1.5rem;
        }
    </style>
</head>
<body class="min-h-screen pb-32 px-4 sm:px-6 lg:px-8 text-gray-700">

    <div id="apiKeyModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 animate-fade-in">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">歡迎使用 BabyTravel</h2>
            <p class="text-gray-500 mb-6 text-sm text-center">本工具需要 **Gemini Key**。</p>
            <input type="password" id="geminiApiKeyInput" placeholder="貼上您的 Gemini API Key" 
                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border border-gray-200 mb-4 outline-none focus:ring-2 focus:ring-blue-100">
            
            <div class="w-full text-center text-xs text-gray-500 mb-4 bg-green-50/50 py-3 rounded-2xl border border-green-200">
                天氣服務 (OpenWeatherMap) Key 已內建
            </div>
            <button onclick="saveApiKeys()" class="w-full bg-gray-800 text-white font-bold py-4 rounded-2xl hover:bg-gray-700 transition-colors">開始使用</button>
            <div class="mt-4 text-center text-xs space-y-2">
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-400 underline block font-bold">取得 Gemini Key (Google AI Studio)</a>
            </div>
        </div>
    </div>

    <div class="absolute top-4 right-4"> 
        <button id="resetKeyBtn" onclick="clearApiKeys()" class="text-xs text-gray-400 hover:text-gray-600 underline transition-colors hidden">重設 Gemini Key</button>
    </div>

    <header class="pt-12 pb-8 text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-700 mb-2 tracking-wide">BabyTravel</h1>
        <p class="text-gray-500 text-sm tracking-widest uppercase">Minimalist Travel Weather & Style Guide</p>
    </header>

    <main class="max-w-4xl mx-auto mb-12">
        <form id="searchForm" class="bg-white p-2 md:p-4 rounded-[2rem] shadow-sm border border-gray-200 flex flex-col md:flex-row gap-2">
            <div class="flex-grow">
                <input type="text" id="destination" placeholder="輸入目的地 (例: 東京)" required
                    class="w-full px-6 py-4 rounded-3xl bg-gray-50 border-none focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all outline-none">
            </div>
            <div class="flex gap-2 md:w-auto w-full bg-gray-50 rounded-3xl px-4 items-center">
                <input type="date" id="startDate" required class="bg-transparent py-4 border-none outline-none text-gray-600 text-sm w-full md:w-auto">
                <span class="text-gray-300">to</span>
                <input type="date" id="endDate" required class="bg-transparent py-4 border-none outline-none text-gray-600 text-sm w-full md:w-auto">
            </div>
            <button type="submit" id="submitBtn" class="w-full md:w-auto bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 px-8 rounded-3xl transition-colors shadow-sm whitespace-nowrap disabled:opacity-50">Go</button>
        </form>
    </main>

    <div id="loadingDisplay" class="hidden flex-col items-center justify-center py-12 space-y-6 animate-fade-in">
        <div class="relative">
            <div class="w-24 h-24 bg-yellow-200 rounded-full animate-bounce flex items-center justify-center shadow-lg shadow-yellow-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>
        <h3 id="loadingText" class="text-xl font-bold text-gray-600 tracking-widest text-center">分析天氣與穿搭...</h3>
    </div>

    <div id="errorDisplay" class="max-w-xl mx-auto hidden bg-red-50 border border-red-200 p-6 rounded-2xl animate-fade-in my-12">
        <h3 class="text-lg font-bold text-red-700 mb-2">發生錯誤</h3>
        <p id="errorText" class="text-sm text-red-600"></p>
        <p class="text-xs text-red-400 mt-4">請點擊右上角「重設 Gemini Key」並重新輸入。</p>
    </div>

    <div id="resultContainer" class="container mx-auto hidden animate-fade-in space-y-4 p-4">
        <div id="weatherCard" class="w-full max-w-5xl mx-auto"></div>
    </div>

    <div id="exportBar" class="fixed bottom-6 left-0 right-0 flex justify-center items-center pointer-events-none z-40 hidden">
        <div class="bg-white/90 backdrop-blur-sm p-2 rounded-full shadow-lg border border-gray-200 pointer-events-auto flex gap-2 transform hover:scale-105 transition-transform">
            <button onclick="exportImage()" id="btnExportImg" class="flex items-center gap-2 px-6 py-3 bg-gray-800 text-white rounded-full hover:bg-gray-700 transition-colors font-bold text-sm">📸 儲存完整結果</button>
            <button onclick="exportExcel()" class="flex items-center gap-2 px-6 py-3 bg-green-600 text-white rounded-full hover:bg-green-500 transition-colors font-bold text-sm">📊 匯出 Excel</button>
        </div>
    </div>

    <footer class="mt-20 text-center text-gray-300 text-xs pb-8">
        <p>Gemini AI Powered</p>
    </footer>

    <script>
        window.currentWeatherData = null;
        let genAI = null;
        const FIXED_OPEN_WEATHER_MAP_KEY = "aec895af7d1fad1bcef7671a192d311a"; 
        const WEATHER_API_URL = "https://api.openweathermap.org/data/2.5/forecast";

        window.clearApiKeys = () => { localStorage.removeItem("gemini_api_key"); location.reload(); }
        window.saveApiKeys = () => {
            const geminiInput = document.getElementById('geminiApiKeyInput').value.trim();
            if (!geminiInput) return alert("請輸入您的 Gemini API Key");
            localStorage.setItem("gemini_api_key", geminiInput);
            location.reload(); 
        }

        function setError(isError, message = "") {
            const errorDisplay = document.getElementById('errorDisplay');
            const errorText = document.getElementById('errorText');
            const resultContainer = document.getElementById('resultContainer');
            const exportBar = document.getElementById('exportBar');
            if (isError) {
                errorText.innerText = message;
                errorDisplay.classList.remove('hidden');
                resultContainer.classList.add('hidden'); exportBar.classList.add('hidden');
            } else {
                errorDisplay.classList.add('hidden');
            }
        }

        function setLoading(isLoading, text) {
            const loader = document.getElementById('loadingDisplay');
            const result = document.getElementById('resultContainer');
            const btn = document.getElementById('submitBtn');
            if (isLoading) {
                loader.classList.remove('hidden'); loader.classList.add('flex');
                result.classList.add('hidden'); setError(false); 
                document.getElementById('loadingText').innerText = text;
                btn.disabled = true; btn.innerText = "...";
            } else {
                loader.classList.add('hidden'); loader.classList.remove('flex');
                btn.disabled = false; btn.innerText = "Go";
                if (document.getElementById('errorDisplay').classList.contains('hidden')) {
                     result.classList.remove('hidden');
                }
            }
        }

        // *** 優化後的截圖功能：抓取整個卡片，並強制背景色 ***
        window.exportImage = async () => { 
            if (typeof window.html2canvas === 'undefined' || !window.currentWeatherData) {
                 alert("資料尚未準備好。"); return;
            }
            
            const btn = document.getElementById('btnExportImg');
            // 改為抓取整個 weatherCard 容器
            const element = document.getElementById('weatherCard'); 
            
            if (!element) return;
            
            const originalText = btn.innerText;
            btn.innerText = "處理中...";
            btn.disabled = true;

            try {
                const canvas = await html2canvas(element, { 
                    scale: 2,
                    backgroundColor: '#FFFBF0', // 確保背景有顏色，不是透明
                    useCORS: true, // 允許抓取跨域圖片
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `BabyTravel-${window.currentWeatherData.location}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) { 
                console.error(err);
                alert("截圖失敗，請稍後再試。"); 
            }
            btn.innerText = originalText;
            btn.disabled = false;
        };

        window.exportExcel = () => { 
            const data = window.currentWeatherData;
            if (!data) return;
            let tableRows = '';
            data.daily.forEach(day => {
                const clothes = day.clothingAdvice.map(c => `[${c.category}] ${c.item}`).join('<br/>');
                tableRows += `<tr><td style="padding:10px">${day.date}</td><td style="padding:10px">${day.condition}</td><td style="padding:10px">${day.temperature}</td><td style="padding:10px">${clothes}</td></tr>`;
            });
            const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><h2>${data.location} (${data.dateRange})</h2><table border="1"><thead><tr><th>日期</th><th>天氣</th><th>氣溫</th><th>穿搭</th></tr></thead><tbody>${tableRows}</tbody></table></body></html>`;
            const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `BabyTravel.xls`;
            link.click();
            URL.revokeObjectURL(url); 
        };
    </script>

    <script>
        const fetchWeather = async (destination) => {
            const owmKey = FIXED_OPEN_WEATHER_MAP_KEY;
            const geocodingUrl = `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(destination)}&limit=1&appid=${owmKey}`;
            const geoResponse = await fetch(geocodingUrl);
            if (!geoResponse.ok) throw new Error("無法連接天氣服務");
            const geoData = await geoResponse.json();
            if (!geoData.length) throw new Error("找不到該地點");
            const { lat, lon, name, country } = geoData[0];
            const weatherUrl = `${WEATHER_API_URL}?lat=${lat}&lon=${lon}&units=metric&lang=zh_tw&appid=${owmKey}`;
            const weatherResponse = await fetch(weatherUrl);
            const weatherData = await weatherResponse.json();
            return { name, country, data: weatherData };
        };

        async function handleSearchSubmit(e) {
            e.preventDefault(); 
            const geminiKey = localStorage.getItem("gemini_api_key");
            if (!geminiKey) { document.getElementById('apiKeyModal').classList.remove('hidden'); return; }

            // 嘗試初始化
            if (!genAI && window.GoogleGenerativeAI) {
                try { 
                    // 相容性處理
                    let AiConstructor = window.GoogleGenerativeAI;
                    if (AiConstructor.GoogleGenerativeAI) AiConstructor = AiConstructor.GoogleGenerativeAI;
                    genAI = new AiConstructor(geminiKey); 
                } 
                catch (e) { setError(true, "Gemini 初始化失敗"); return; }
            }

            const dest = document.getElementById('destination').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            setError(false); 
            setLoading(true, "查詢天氣中...");

            try {
                const rawWeatherData = await fetchWeather(dest);
                setLoading(true, "AI 分析穿搭中...");

                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" }); 
                const weatherDataJson = JSON.stringify(rawWeatherData.data);
                
                const prompt = `
                    Based on this OpenWeatherMap forecast for ${rawWeatherData.name} (${start} to ${end}):
                    ${weatherDataJson}
                    
                    Create a JSON response for a baby clothing guide.
                    Schema:
                    {
                      "location": "${rawWeatherData.name}",
                      "dateRange": "${start} - ${end}",
                      "daily": [
                        {
                          "date": "MM/DD (Day)",
                          "temperature": "Range",
                          "condition": "Weather description",
                          "clothingAdvice": [
                            { "category": "Head/Outerwear/Top/Bottom/Shoes", "item": "Item Name", "reason": "Why" }
                          ],
                          "visualPrompt": "Visual description of the baby's outfit"
                        }
                      ]
                    }
                    Language: Traditional Chinese (繁體中文).
                `;

                const result = await model.generateContent(prompt);
                const responseText = result.response.text();
                const jsonMatch = responseText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("AI 回傳格式錯誤");
                
                const parsedData = JSON.parse(jsonMatch[0]);
                parsedData.sources = []; 
                window.currentWeatherData = parsedData;

                renderWeatherCard(parsedData);
                setLoading(true, "繪製穿搭圖 (童趣簡筆風)..."); 
                
                await generateImages(parsedData);
                
                setLoading(false); 
                document.getElementById('exportBar').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                setError(true, "發生錯誤: " + (error.message || "未知錯誤"));
                setLoading(false); 
            }
        }

        // *** 優化：童趣簡筆畫風格 (Childlike Simple Line Drawing) ***
        async function generateImages(data) {
             const imagePromises = data.daily.map((day, i) => {
                return new Promise(async (resolve) => {
                    const containerId = `img-container-${i}`;
                    
                    // 提取衣物
                    const clothingList = day.clothingAdvice.map(c => c.item).join(", ");
                    
                    // *** 關鍵 Prompt 修正：強調童趣、簡筆畫、蠟筆質感 ***
                    // 權重語法 (High priority) 用於強調衣物
                    const stylePrompt = `
                        (Children's book illustration style, Crayon drawing, Simple lines, Cute, Soft colors). 
                        A cute baby standing. 
                        WEARING: ${clothingList}. 
                        Background: White paper texture. 
                        Style: Hand-drawn, minimalist, adorable.
                    `;
                    
                    const encodedPrompt = encodeURIComponent(stylePrompt);
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*1000)}`;

                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = imageUrl;
                    img.className = "w-full h-full object-cover p-0 animate-fade-in rounded-2xl";
                    
                    img.onload = () => {
                        const container = document.getElementById(containerId);
                        if (container) { container.innerHTML = ''; container.appendChild(img); data.daily[i].generatedImage = imageUrl; }
                        resolve();
                    };
                    img.onerror = () => {
                        const container = document.getElementById(containerId);
                        if (container) container.innerHTML = '<div class="text-xs text-gray-300 p-4 text-center">繪圖失敗</div>';
                        resolve();
                    };
                });
            });
            await Promise.all(imagePromises);
        }

        function getCategoryIcon(cat) {
            const icons = { 'Head': '🧢', 'Outerwear': '🧥', 'Top': '👕', 'Bottom': '👖', 'Shoes': '👟', 'Accessories': '🧣' };
            return icons[cat] || '✨';
        }

        function renderWeatherCard(data) {
            const container = document.getElementById('weatherCard');
            document.getElementById('resultContainer').classList.remove('hidden');

            // 使用 weather-card-export 類別，確保截圖時背景正確
            let html = `
                <div class="weather-card-export bg-white">
                    <div class="text-center mb-8">
                        <h2 class="text-3xl font-bold text-gray-700 mb-2 tracking-wider">${data.location}</h2>
                        <div class="inline-block px-4 py-1 border border-gray-300 rounded-full">
                            <span class="text-
