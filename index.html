    <!-- 整個 App 的程式都寫在這個 module 裡 -->
    <script type="module">
      import React, { useState, useEffect } from "react";
      import ReactDOM from "react-dom/client";
      import { GoogleGenAI } from "@google/genai";

      // -----------------------------
      // 型別（用註解表示給自己看，不影響 JS）
      // -----------------------------
      /**
       * @typedef {Object} ClothingItem
       * @property {"Head"|"Outerwear"|"Top"|"Bottom"|"Shoes"|"Accessories"} category
       * @property {string} item
       * @property {string} reason
       */

      /**
       * @typedef {Object} DailyForecast
       * @property {string} date
       * @property {string} temperature
       * @property {string} condition
       * @property {ClothingItem[]} clothingAdvice
       * @property {string} visualPrompt
       * @property {string=} generatedImage
       */

      /**
       * @typedef {Object} WeatherData
       * @property {string} location
       * @property {string} dateRange
       * @property {DailyForecast[]} daily
       * @property {{title:string,uri:string}[]=} sources
       */

      /**
       * @typedef {Object} GenerationState
       * @property {"idle"|"loading-weather"|"loading-images"|"complete"|"error"} status
       * @property {string=} message
       */

      // -----------------------------
      // Gemini 服務：建立 client + 呼叫 API
      // -----------------------------
      function createGeminiClient(apiKey) {
        return new GoogleGenAI({ apiKey });
      }

      /**
       * 取得天氣與穿搭建議（文字 + 每天的 visualPrompt）
       * @param {*} ai
       * @param {string} destination
       * @param {string} startDate
       * @param {string} endDate
       * @returns {Promise<WeatherData>}
       */
      async function getWeatherAndAdvice(ai, destination, startDate, endDate) {
        const model = "gemini-2.5-flash";

        const prompt = `
I am traveling to ${destination} from ${startDate} to ${endDate} with a baby/toddler.
Please:
1. Check the REAL weather forecast for those days using tools.
2. For EACH DAY, give:
   - simple weather condition (in Traditional Chinese, short)
   - temperature range in °C, like "18–22°C"
   - 3–6 clothing items grouped by category (Head / Outerwear / Top / Bottom / Shoes / Accessories), each with a short reason in Traditional Chinese.
   - a detailed English visualPrompt to draw a minimalist Japanese baby outfit illustration for THAT day.

Important:
* Trip is with a baby/toddler, so emphasize warmth, safety, layering, and avoiding overheating.
* Visual prompt should describe the baby's outfit clearly, including colors and key items.

Output JSON in EXACTLY this shape, no extra commentary and no markdown:

{
  "location": "地名(中文或英文皆可)",
  "dateRange": "YYYY/MM/DD–YYYY/MM/DD",
  "daily": [
    {
      "date": "10/25 (Fri)",
      "temperature": "18–22°C",
      "condition": "多雲偶雨",
      "clothingAdvice": [
        { "category": "Head", "item": "薄針織毛帽", "reason": "早晚偏涼，保護頭部保暖" },
        { "category": "Outerwear", "item": "輕薄防風外套", "reason": "可因應風大與溫差，方便穿脫" }
      ],
      "visualPrompt": "A cute toddler in ... (English description for baby outfit illustration)"
    }
  ]
}
        `.trim();

        try {
          const response = await ai.models.generateContent({
            model,
            contents: prompt,
            config: {
              tools: [{ googleSearch: {} }],
            },
          });

          let text = response.text;
          if (!text) {
            throw new Error("No text response from Gemini");
          }

          // 從回傳文字裡抓出純 JSON（避免包在 ```json ... ``` 之類）
          const jsonBlockMatch = text.match(/```json\\s*(\\{[\\s\\S]*\\})\\s*```/i);
          if (jsonBlockMatch) {
            text = jsonBlockMatch[1];
          } else {
            const firstBrace = text.indexOf("{");
            const lastBrace = text.lastIndexOf("}");
            if (firstBrace !== -1 && lastBrace !== -1) {
              text = text.substring(firstBrace, lastBrace + 1);
            }
          }

          const data = JSON.parse(text);

          const groundingChunks =
            response.candidates?.[0]?.groundingMetadata?.groundingChunks;
          if (groundingChunks) {
            data.sources = groundingChunks
              .filter((chunk) => chunk.web?.uri && chunk.web?.title)
              .map((chunk) => ({
                title: chunk.web.title,
                uri: chunk.web.uri,
              }));
          }

          return data;
        } catch (error) {
          console.error("Weather fetch error:", error);
          throw error;
        }
      }

      /**
       * 依當天 visualPrompt 產生寶寶穿搭圖
       * @param {*} ai
       * @param {string} visualPrompt
       * @returns {Promise<string>} base64 dataURL
       */
      async function generateBabyOutfitImage(ai, visualPrompt) {
        const model = "gemini-2.5-flash-image";

        const enhancedPrompt = `
(Art Style: Minimalist Japanese flat illustration, Vector style).
${visualPrompt}.
Character: A cute baby or toddler.
Style guide: Clean simple lines, flat colors, pastel tones (pinks, creams, light browns, soft blues), lots of negative space, no complex shading, simple geometric shapes.
Background: Pure white or very subtle solid color.
Full body shot.
        `.trim();

        try {
          const response = await ai.models.generateContent({
            model,
            contents: enhancedPrompt,
            config: {
              imageConfig: {
                aspectRatio: "1:1",
              },
            },
          });

          for (const candidate of response.candidates || []) {
            for (const part of candidate.content.parts) {
              if (part.inlineData && part.inlineData.data) {
                return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
              }
            }
          }

          throw new Error("No image generated");
        } catch (error) {
          console.error("Image generation error:", error);
          throw error;
        }
      }

      // -----------------------------
      // UI Component：WeatherCard
      // -----------------------------
      function CategoryIcon({ category }) {
        switch (category) {
          case "Head":
            return <span className="text-lg">🧢</span>;
          case "Outerwear":
            return <span className="text-lg">🧥</span>;
          case "Top":
            return <span className="text-lg">👕</span>;
          case "Bottom":
            return <span className="text-lg">👖</span>;
          case "Shoes":
            return <span className="text-lg">👟</span>;
          case "Accessories":
            return <span className="text-lg">🧣</span>;
          default:
            return <span className="text-lg">👶</span>;
        }
      }

      /**
       * @param {{data: WeatherData}} props
       */
      function WeatherCard({ data }) {
        return (
          <div
            id="weather-results-container"
            className="bg-baby-card rounded-3xl shadow-xl shadow-rose-100 border border-rose-100 p-6 md:p-8 space-y-6"
          >
            {/* Header */}
            <div className="flex flex-wrap items-baseline justify-between gap-3 pb-4 border-b border-gray-100">
              <div>
                <p className="text-xs uppercase tracking-[0.2em] text-gray-400">
                  Baby Travel Planner
                </p>
                <h2 className="text-2xl md:text-3xl font-bold text-baby-text mt-1">
                  {data.location || "旅行目的地"}
                </h2>
              </div>
              <div className="bg-baby-yellow text-yellow-700 text-xs font-semibold px-3 py-1 rounded-full">
                {data.dateRange}
              </div>
            </div>

            {/* Daily cards */}
            <div className="space-y-6">
              {data.daily.map((day, idx) => (
                <div
                  key={idx}
                  className="flex flex-col md:flex-row gap-6 md:gap-8 p-4 md:p-5 rounded-2xl bg-gradient-to-r from-white to-rose-50/70 border border-rose-100"
                >
                  {/* 左邊：圖片 */}
                  <div className="w-full md:w-1/3 lg:w-1/4 flex-shrink-0">
                    <div
                      className="aspect-square w-full rounded-2xl bg-white relative flex items-center justify-center border border-gray-50"
                    >
                      {day.generatedImage ? (
                        <img
                          src={day.generatedImage}
                          alt={`Outfit for ${day.date}`}
                          className="w-full h-full object-contain p-2 animate-fade-in"
                          crossOrigin="anonymous"
                        />
                      ) : (
                        <div className="flex flex-col items-center text-gray-300 space-y-2">
                          <div
                            className="w-8 h-8 border-2 border-gray-200 border-t-accent-primary rounded-full animate-spin"
                          ></div>
                          <span className="text-xs tracking-widest">
                            DRAWING...
                          </span>
                        </div>
                      )}
                    </div>
                    <div className="text-center mt-3 hidden md:block">
                      <p className="text-[10px] text-gray-300 font-light tracking-[0.2em] uppercase">
                        Daily Look
                      </p>
                    </div>
                  </div>

                  {/* 右邊：詳細資料 */}
                  <div className="flex-grow w-full space-y-4">
                    {/* 日期 + 天氣 */}
                    <div className="flex flex-wrap items-center justify-between pb-3 border-b border-gray-100 gap-3">
                      <div className="flex items-center space-x-3">
                        <div className="bg-baby-yellow text-yellow-700 font-bold px-4 py-2 rounded-xl text-sm">
                          {day.date}
                        </div>
                        <div className="flex items-center text-sm text-gray-500 space-x-2">
                          <span>🌤 {day.condition}</span>
                          <span className="w-px h-3 bg-gray-200"></span>
                          <span>🌡 {day.temperature}</span>
                        </div>
                      </div>
                    </div>

                    {/* 穿搭建議 */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {day.clothingAdvice.map((item, i) => (
                        <div
                          key={i}
                          className="flex items-start gap-3 p-2 rounded-xl bg-white/70 border border-rose-50"
                        >
                          <div className="w-8 h-8 flex items-center justify-center rounded-full bg-rose-50">
                            <CategoryIcon category={item.category} />
                          </div>
                          <div className="space-y-1">
                            <p className="text-xs font-semibold text-baby-text">
                              [{item.category}] {item.item}
                            </p>
                            <p className="text-xs text-gray-500 leading-snug">
                              {item.reason}
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* 資料來源 */}
            {data.sources && data.sources.length > 0 && (
              <div className="text-center mt-4">
                <p className="text-xs text-gray-300 mb-1">Data Sources</p>
                <div className="flex flex-wrap justify-center gap-x-4 gap-y-1">
                  {data.sources.map((source, idx) => (
                    <a
                      key={idx}
                      href={source.uri}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-xs text-gray-400 hover:text-accent-primary underline decoration-gray-200"
                    >
                      {source.title}

                  ))}

              </div>
            )}
          </div>
        );
      }

      // -----------------------------
      // UI Component：ExportBar
      // -----------------------------
      /**
       * @param {{data: WeatherData}} props
       */
      function ExportBar({ data }) {
        const [isExporting, setIsExporting] = useState(false);

        const handleSaveImage = async () => {
          const container = document.getElementById(
            "weather-results-container"
          );
          if (!container) {
            alert("找不到要匯出的內容區塊。");
            return;
          }
          if (!window.html2canvas) {
            alert("html2canvas 尚未載入，無法匯出圖片。");
            return;
          }
          setIsExporting(true);
          try {
            const canvas = await window.html2canvas(container, {
              backgroundColor: "#FFFBF0",
              useCORS: true,
              scale: 2,
            });
            const dataUrl = canvas.toDataURL("image/png");
            const a = document.createElement("a");
            a.href = dataUrl;
            const safeLocation = (data.location || "trip")
              .replace(/[\\s/\\\\]+/g, "-")
              .toLowerCase();
            a.download = `babytravel-${safeLocation}.png`;
            a.click();
          } catch (e) {
            console.error(e);
            alert("無法儲存圖片，請稍後再試。");
          } finally {
            setIsExporting(false);
          }
        };

        const handleExcelExport = () => {
          let tableRows = "";
          data.daily.forEach((day) => {
            const clothes = day.clothingAdvice
              .map((c) => `[${c.category}] ${c.item}`)
              .join("<br/>");
            const imageTag = day.generatedImage
              ? `<img src="${day.generatedImage}" width="150" height="150" />`
              : "(No Image)";
            tableRows += `
              <tr>
                <td style="vertical-align: middle; padding: 8px;">${day.date}</td>
                <td style="vertical-align: middle; padding: 8px;">${day.condition}</td>
                <td style="vertical-align: middle; padding: 8px;">${day.temperature}</td>
                <td style="vertical-align: middle; padding: 8px;">${clothes}</td>
                <td style="vertical-align: middle; padding: 8px;">${imageTag}</td>
              </tr>
            `;
          });

          const html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office"
                  xmlns:x="urn:schemas-microsoft-com:office:excel"
                  xmlns="http://www.w3.org/TR/REC-html40">
              <head>
                <meta charset="UTF-8" />
                <!--[if gte mso 9]>
                  <xml>
                    <x:ExcelWorkbook>
                      <x:ExcelWorksheets>
                        <x:ExcelWorksheet>
                          <x:Name>BabyTravel</x:Name>
                          <x:WorksheetOptions>
                            <x:Print>
                              <x:ValidPrinterInfo/>
                            </x:Print>
                          </x:WorksheetOptions>
                        </x:ExcelWorksheet>
                      </x:ExcelWorksheets>
                    </x:ExcelWorkbook>
                  </xml>
                <![endif]-->
              </head>
              <body>
                <table border="1" style="border-collapse: collapse;">
                  <thead>
                    <tr style="background:#FFE4EC;">
                      <th>Date</th>
                      <th>Condition</th>
                      <th>Temperature</th>
                      <th>Outfit Advice</th>
                      <th>Baby Look</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tableRows}
                  </tbody>
                </table>
              </body>
            </html>
          `;

          const blob = new Blob([html], {
            type: "application/vnd.ms-excel",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const safeLocation = (data.location || "trip")
            .replace(/[\\s/\\\\]+/g, "-")
            .toLowerCase();
          a.href = url;
          a.download = `babytravel-${safeLocation}.xls`;
          a.click();
          URL.revokeObjectURL(url);
        };

        return (
          <div className="mt-6 flex flex-col md:flex-row items-center justify-between gap-3 bg-white/70 border border-rose-100 rounded-2xl px-4 py-3">
            <div className="text-xs text-gray-400">
              <p>📸 可以將上方整張卡片存成圖片，或匯出 Excel 詳細列表。</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={handleSaveImage}
                disabled={isExporting}
                className="flex items-center gap-2 px-4 py-2 bg-gray-800 text-white rounded-full hover:bg-gray-700 transition-colors text-sm font-bold disabled:opacity-60"
              >
                {isExporting ? "Saving..." : "📸 Save as Image"}
              </button>
              <button
                onClick={handleExcelExport}
                className="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-full hover:bg-green-600 transition-colors text-sm font-bold"
              >
                📊 Export Excel
              </button>
            </div>
          </div>
        );
      }

      // -----------------------------
      // 主 App（含 API Key 輸入＋重設）
      // -----------------------------
      function App() {
        // 日期預設：今天～後兩天（3 天行程）
        const getDefaultDates = () => {
          const start = new Date();
          const end = new Date();
          end.setDate(end.getDate() + 2);
          return {
            start: start.toISOString().split("T")[0],
            end: end.toISOString().split("T")[0],
          };
        };

        const defaults = getDefaultDates();

        const [apiKey, setApiKey] = useState(
          localStorage.getItem("geminiApiKey") || ""
        );
        const [apiKeyInput, setApiKeyInput] = useState(apiKey);
        const [destination, setDestination] = useState("");
        const [startDate, setStartDate] = useState(defaults.start);
        const [endDate, setEndDate] = useState(defaults.end);
        const [weatherData, setWeatherData] = useState(null);
        const [genState, setGenState] = useState({
          status: "idle",
          message: "",
        });

        const handleSaveApiKey = () => {
          const trimmed = apiKeyInput.trim();
          if (!trimmed) {
            alert("請輸入有效的 Gemini API Key。");
            return;
          }
          localStorage.setItem("geminiApiKey", trimmed);
          setApiKey(trimmed);
          alert("已儲存 API Key！");
        };

        const handleResetApiKey = () => {
          localStorage.removeItem("geminiApiKey");
          setApiKey("");
          setApiKeyInput("");
          alert("已清除儲存的 API Key。");
        };

        const handleSearch = async (e) => {
          e.preventDefault();
          if (!destination.trim()) return;

          if (!apiKey.trim()) {
            alert("請先在上方輸入並儲存 Gemini API Key。");
            return;
          }

          setGenState({
            status: "loading-weather",
            message: "分析當地天氣與穿搭建議中…",
          });
          setWeatherData(null);

          try {
            const ai = createGeminiClient(apiKey.trim());

            // Step 1：文字天氣＋穿搭建議
            const data = await getWeatherAndAdvice(
              ai,
              destination,
              startDate,
              endDate
            );
            setWeatherData(data);
            setGenState({
              status: "loading-images",
              message: "正在為每一天繪製專屬寶寶穿搭…",
            });

            // Step 2：根據每天 visualPrompt 畫圖
            const dailyCopy = [...data.daily];

            await Promise.allSettled(
              dailyCopy.map(async (day, index) => {
                if (!day.visualPrompt) return;
                try {
                  const imgUrl = await generateBabyOutfitImage(
                    ai,
                    day.visualPrompt
                  );
                  dailyCopy[index] = {
                    ...dailyCopy[index],
                    generatedImage: imgUrl,
                  };
                  // 一張一張更新畫面
                  setWeatherData((prev) =>
                    prev ? { ...prev, daily: [...dailyCopy] } : prev
                  );
                } catch (err) {
                  console.error("Image error for day", index, err);
                }
              })
            );

            setGenState({ status: "complete", message: "" });
          } catch (error) {
            console.error(error);
            setGenState({
              status: "error",
              message:
                "取得資料時發生錯誤，請確認 API Key 是否正確，或稍後再試。",
            });
          }
        };

        return (
          <div className="min-h-screen flex items-center justify-center p-4 md:p-8">
            <div className="w-full max-w-5xl mx-auto">
              {/* 外框卡片 */}
              <div className="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl shadow-rose-100 border border-rose-100 px-6 md:px-10 py-8 md:py-10">
                {/* 標題區 */}
                <header className="mb-8">
                  <div className="flex items-center justify-between gap-3 mb-2">
                    <div>
                      <p className="text-[10px] uppercase tracking-[0.3em] text-rose-300">
                        BABYTRAVEL WEATHER &amp; STYLE
                      </p>
                      <h1 className="text-2xl md:text-3xl font-bold text-baby-text mt-1">
                        寶寶穿搭天氣小幫手
                      </h1>
                    </div>
                    <div className="hidden md:flex items-center gap-2 text-xs text-gray-400">
                      <span className="inline-flex h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>
                      <span>Gemini AI Powered</span>
                    </div>
                  </div>
                  <p className="text-xs md:text-sm text-gray-500">
                    幫你查詢旅遊期間的天氣，並為每一天設計一套專屬寶寶穿搭，
                    還可以存成圖片或 Excel 帶著走。
                  </p>
                </header>

                {/* API Key 區塊 */}
                <section className="mb-6 p-4 rounded-2xl bg-rose-50/80 border border-rose-100 space-y-3">
                  <div className="flex items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-semibold text-baby-text">
                        Gemini API Key
                      </span>
                      <span className="text-[10px] text-gray-400">
                        （只會儲存在你的瀏覽器裡）
                      </span>
                    </div>
                    {apiKey ? (
                      <span className="inline-flex items-center gap-1 text-[10px] text-green-600">
                        <span className="w-2 h-2 bg-green-500 rounded-full"></span>
                        已儲存
                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 text-[10px] text-amber-600">
                        <span className="w-2 h-2 bg-amber-400 rounded-full"></span>
                        尚未設定
                      </span>
                    )}
                  </div>
                  <div className="flex flex-col md:flex-row gap-3">
                    <input
                      type="password"
                      value={apiKeyInput}
                      onChange={(e) => setApiKeyInput(e.target.value)}
                      placeholder="請貼上你的 Gemini API Key"
                      className="flex-1 px-3 py-2 text-xs md:text-sm rounded-xl border border-rose-200 bg-white/80 outline-none focus:ring-2 focus:ring-accent-primary/40"
                    />
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={handleSaveApiKey}
                        className="px-3 md:px-4 py-2 text-xs md:text-sm rounded-xl bg-accent-primary text-white font-semibold hover:bg-rose-500 transition-colors"
                      >
                        儲存
                      </button>
                      <button
                        type="button"
                        onClick={handleResetApiKey}
                        className="px-3 md:px-4 py-2 text-xs md:text-sm rounded-xl bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors"
                      >
                        重設
                      </button>
                    </div>
                  </div>
                </section>

                {/* 查詢表單 */}
                <form
                  onSubmit={handleSearch}
                  className="mb-6 flex flex-col md:flex-row gap-3 md:gap-4 items-stretch"
                >
                  <div className="flex-1 flex items-center bg-gray-50 rounded-3xl px-4">
                    <span className="mr-2 text-lg">📍</span>
                    <input
                      type="text"
                      value={destination}
                      onChange={(e) => setDestination(e.target.value)}
                      placeholder="輸入目的地（例：東京、大阪、北海道）"
                      className="w-full bg-transparent py-3 text-sm md:text-base text-gray-700 placeholder-gray-400 outline-none"
                      required
                    />
                  </div>

                  <div
                    className="flex gap-2 bg-gray-50 rounded-3xl px-4 items-center"
                  >
                    <input
                      type="date"
                      value={startDate}
                      min={new Date().toISOString().split("T")[0]}
                      onChange={(e) => setStartDate(e.target.value)}
                      className="bg-transparent py-3 border-none focus:ring-0 text-gray-600 text-xs md:text-sm outline-none"
                      required
                    />
                    <span className="text-gray-300 text-xs md:text-sm">to</span>
                    <input
                      type="date"
                      value={endDate}
                      min={startDate}
                      onChange={(e) => setEndDate(e.target.value)}
                      className="bg-transparent py-3 border-none focus:ring-0 text-gray-600 text-xs md:text-sm outline-none"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full md:w-auto px-6 py-3 rounded-3xl bg-accent-primary text-white font-bold text-sm md:text-base shadow-md shadow-rose-200 hover:bg-rose-500 transition-all flex items-center justify-center gap-2"
                  >
                    <span>🔍 生成寶寶穿搭</span>
                  </button>
                </form>

                {/* 狀態區：Loading / 結果 / 錯誤 */}
                <main>
                  {genState.status === "loading-weather" && (
                    <LoadingDisplay message={genState.message} />
                  )}

                  {(genState.status === "loading-images" ||
                    genState.status === "complete") &&
                    weatherData && (
                      <div className="animate-fade-in space-y-4">
                        {genState.status === "loading-images" && (
                          <div className="text-center text-gray-400 text-xs animate-pulse mb-2">
                            正在為每一天繪製寶寶穿搭插圖…
                          </div>
                        )}
                        <WeatherCard data={weatherData} />
                        <ExportBar data={weatherData} />
                      </div>
                    )}

                  {genState.status === "error" && (
                    <div className="text-center p-8 text-gray-400">
                      <p>{genState.message}</p>
                    </div>
                  )}

                  {genState.status === "idle" && !weatherData && (
                    <div className="text-center text-xs text-gray-400 mt-4">
                      請先輸入 API Key 和目的地，選好日期後按下「生成寶寶穿搭」。
                    </div>
                  )}
                </main>

                {/* Footer */}
                <footer className="mt-10 text-center text-gray-300 text-[10px]">
                  <p>Gemini AI Powered · BabyTravel Weather &amp; Style</p>
                </footer>
              </div>

              {/* 全域動畫樣式 */}
              <style>
                {`
                  .animate-fade-in {
                    animation: fadeIn 0.8s ease-out forwards;
                  }
                  @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                  }
                `}
              </style>
            </div>
          </div>
        );
      }

      // -----------------------------
      // React 啟動
      // -----------------------------
      const rootElement = document.getElementById("root");
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
